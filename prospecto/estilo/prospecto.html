<script>
/* Prospecto R: definiciones emergentes del diccionario y botón «Copiar para mi tesis» */
(function () {
  function iniciar() {
    // 1. definiciones al pasar el mouse sobre los términos enlazados al diccionario
    var enlaces = Array.prototype.slice.call(document.querySelectorAll("a.dic"));
    if (enlaces.length && typeof tippy === "function") {
      var poner = function (defs) {
        enlaces.forEach(function (a) {
          var id = (a.getAttribute("href") || "").split("#")[1];
          var x = defs[id];
          if (!x) return;
          tippy(a, {
            content: '<div class="dic-tip"><strong>' + x.t + '</strong><p>' + x.d + '</p><span>Clic para ver las fuentes</span></div>',
            allowHTML: true, maxWidth: 380, placement: "top", delay: [120, 0], theme: "prospecto"
          });
        });
      };
      if (window.PROSPECTO_DIC) { poner(window.PROSPECTO_DIC); }
      else {
        var url = new URL(enlaces[0].getAttribute("href").split("#")[0], location.href);
        fetch(url).then(function (r) { return r.text(); }).then(function (html) {
          var doc = new DOMParser().parseFromString(html, "text/html"), defs = {};
          doc.querySelectorAll(".entrada").forEach(function (e) {
            var h = e.querySelector("h3"), p = e.querySelector("p");
            if (h && p) defs[e.id] = { t: h.textContent.trim(), d: p.innerHTML };
          });
          poner(defs);
        }).catch(function () {});
      }
    }
    // 2. botón para copiar el párrafo de reporte
    document.querySelectorAll(".reporte blockquote").forEach(function (bq) {
      var b = document.createElement("button");
      var etiqueta = "Copiar para mi tesis";
      b.type = "button"; b.className = "btn-copiar"; b.textContent = etiqueta;
      b.addEventListener("click", function () {
        var texto = bq.innerText.replace(/ /g, " ").trim();
        var listo = function () { b.textContent = "¡Copiado!"; setTimeout(function () { b.textContent = etiqueta; }, 1800); };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(texto).then(listo);
        } else {
          var t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t);
          t.select(); document.execCommand("copy"); document.body.removeChild(t); listo();
        }
      });
      bq.parentNode.insertBefore(b, bq.nextSibling);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar); else iniciar();
})();
</script>
