<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Inter;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Mono;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
@page{size:A4;margin:0}
:root{--navy:#0B1F3A;--acc:#E5636F;--tq:#2A9DA3;--paper:#FBF7EE;--ink:#1F2A37;--muted:#5B6B80;--line:#E3E7ED}
*{box-sizing:border-box;margin:0;padding:0}
body{width:210mm;height:297mm;font-family:Inter;color:var(--ink);font-size:10pt;line-height:1.48;position:relative;overflow:hidden}
header{background:var(--navy);color:#F5F7FA;padding:12mm 14mm 9mm}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:30px}
.tags span{display:inline-block;font-weight:700;letter-spacing:.12em;font-size:7.5pt;padding:3px 8px;border-radius:5px;margin-left:6px}
.t1{background:var(--acc);color:var(--navy)}
.t2{border:1.5px solid #F5F7FA}
.t2.plena{background:var(--paper);color:var(--navy);border-color:var(--acc)}
h1{font-family:Fraunces;font-weight:600;font-size:25pt;line-height:1.08;margin-top:7mm}
h1 em{font-style:normal;color:var(--acc)}
main{padding:8mm 14mm 0;display:grid;grid-template-columns:1fr 1fr;gap:5.5mm 8mm}
section h2{font-size:7.8pt;font-weight:700;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;margin-bottom:2mm;padding-bottom:1.2mm;border-bottom:1px dashed #CBBFA6}
ul{padding-left:4.2mm}
li{margin-bottom:1.2mm}
.full{grid-column:1/3}
pre{font-family:Mono;font-size:8.5pt;line-height:1.5;font-variant-ligatures:none;background:var(--paper);border-left:3px solid var(--tq);padding:3mm 4mm;border-radius:0 6px 6px 0;white-space:pre-wrap}
.hall{background:var(--navy);color:#fff;border-radius:8px;padding:3.5mm 4.5mm;font-size:9.4pt}
.rep{background:#F6F8FA;border-left:3px solid var(--acc);padding:3mm 4mm;border-radius:0 6px 6px 0;font-style:normal}
footer{position:absolute;left:14mm;right:14mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7.8pt;color:var(--muted);border-top:1px solid var(--line);padding-top:2.5mm}
footer b{color:var(--ink)}
</style></head><body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const D = JSON.parse(P.get('d')); const F = D.ficha;
const plena = D.nivel === 'plena';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ul = a => '<ul>' + a.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
document.getElementById('root').innerHTML = `
<header><div class="top"><img src="logo-transparente.png">
 <div class="tags"><span class="t1">PROSPECTO R · N.º ${esc(D.n)}</span><span class="t2 ${plena ? 'plena' : ''}">${plena ? 'DOSIS PLENA' : 'DOSIS INICIAL'}</span></div></div>
 <h1>${esc(D.t1)} <em>${esc(D.t2)}</em></h1></header>
<main>
 <section><h2>Úsalo cuando</h2>${ul(F.usar)}</section>
 <section><h2>Cómo leerlo</h2>${ul(F.leer)}</section>
 <section class="full"><h2>Código clave</h2><pre>${esc(F.codigo)}</pre></section>
 <section class="full"><h2>Hallazgo del ejemplo</h2><div class="hall">${esc(F.hallazgo)}</div></section>
 <section class="full"><h2>Cómo reportarlo</h2><div class="rep">${esc(F.reporte)}</div></section>
 <section class="full"><h2>Evita</h2>${ul(F.evitar)}</section>
</main>
<footer><span><b>Anthony Romero-Cerdán, MD</b></span><span>Tutorial completo, código y diccionario: <b>anthonyromero.netlify.app/prospecto</b></span></footer>`;
</script></body></html>
