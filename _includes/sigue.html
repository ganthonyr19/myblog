<script>
/* Cierre de cada entrada: tarjeta «Síguenos en Instagram» (no en listados ni en el inicio).
   Si la entrada tiene una tarjeta de WhatsApp (.cta) al final de su contenido, ambas se
   muestran juntas, compactas y lado a lado, dentro de <div class="cierre">. */
(function () {
  var IG = "https://www.instagram.com/bioestadistica.en.linea/";
  function poner() {
    var main = document.querySelector("main#quarto-document-content") || document.querySelector("main");
    if (!main || document.querySelector(".quarto-listing") || document.querySelector(".quarto-about-jolla, .about-entity")) return;
    if (!document.querySelector(".quarto-title") || document.body.classList.contains("sin-sigue")) return;
    var d = document.createElement("div");
    d.className = "sigue-ig";
    d.innerHTML =
      '<p class="sigue-t"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>¿Te sirvió?</p>' +
      '<p>En Instagram comparto tips de bioestadística y R para tesis de salud, y aviso cuando sale una entrega nueva.</p>' +
      '<a href="' + IG + '" target="_blank" rel="noopener">Seguir @bioestadistica.en.linea</a>';
    var ctas = main.querySelectorAll(".cta");
    var cta = ctas.length ? ctas[ctas.length - 1] : null;
    if (cta && !cta.nextElementSibling) {
      var c = document.createElement("div");
      c.className = "cierre";
      cta.parentNode.insertBefore(c, cta);
      c.appendChild(cta);
      c.appendChild(d);
      return;
    }
    var ap = main.querySelector("#quarto-appendix, .quarto-appendix-contents");
    if (ap) ap.parentNode.insertBefore(d, ap); else main.appendChild(d);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", poner); else poner();
})();
</script>
