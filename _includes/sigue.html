<script>
/* Tarjeta «Síguenos en Instagram» al final de cada entrada (no en listados ni en el inicio). */
(function () {
  var IG = "https://www.instagram.com/bioestadistica.en.linea/";
  function poner() {
    var main = document.querySelector("main#quarto-document-content") || document.querySelector("main");
    if (!main || document.querySelector(".quarto-listing") || document.querySelector(".quarto-about-jolla, .about-entity")) return;
    if (!document.querySelector(".quarto-title") || document.body.classList.contains("sin-sigue")) return;
    var d = document.createElement("aside");
    d.className = "sigue-ig";
    d.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>' +
      '<div><p class="sigue-t">¿Te sirvió?</p><p>En Instagram comparto tips de bioestadística y R para tesis de salud, y aviso cuando sale una entrega nueva.</p></div>' +
      '<a href="' + IG + '" target="_blank" rel="noopener">Seguir @bioestadistica.en.linea</a>';
    var ap = main.querySelector("#quarto-appendix, .quarto-appendix-contents");
    if (ap) ap.parentNode.insertBefore(d, ap); else main.appendChild(d);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", poner); else poner();
})();
</script>
