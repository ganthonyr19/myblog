project:
  type: website

website:
  site-url: https://anthonyromero.netlify.app/
  favicon: images/logo-final2.png
  page-navigation: true
  navbar:
    title: false
    logo: images/icon.png
    collapse-below: lg
    left:
      - text: Home
        href: index.qmd
      - text: Posts
        href: blog.qmd
      # - text: Tutoriales
      #   href: tutoriales.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        menu:
         - text: Source code
           href: https://github.com/ganthonyr19/myblog
         - text: Report a bug
           href: https://github.com/ganthonyr19/myblog/issues
      - icon: twitter
        href: https://twitter.com/ganthonyr94
        # text: My twitter account
  page-footer: 
    left: |
      Creado con ![](/images/ricon24.png) y [Quarto](https://quarto.org).  
      Código fuente [![](/images/github-icon.png)](https://github.com/ganthonyr19/myblog)
    background: light
    right: |
     &copy; 2023-2026 Anthony Romero Cerdán  
      License: [CC BY NC SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).
    border: false
  reader-mode: true
format:
  html:
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    html-math-method: katex
    header-includes: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    page-layout: full
    theme:
      light: flatly
      dark: darkly
    css: styles.css
mainfont: "Source Sans 3"
link-external-newwindow: TRUE