project:
  type: website

lang: es

website:
  title: "Anthony Romero · Bioestadística en línea"
  description: "Tutoriales, recursos y novedades sobre R y ciencia de datos aplicada a la investigación en salud."
  site-url: https://anthonyromero.netlify.app/
  favicon: images/logo-final2.png
  page-navigation: true
  open-graph: true
  twitter-card: true
  navbar:
    title: false
    logo: images/icon.png
    collapse-below: lg
    left:
      - text: Inicio
        href: index.qmd
      - text: Aprende
        menu:
          - text: Prospecto R
            href: prospecto/index.qmd
          - text: Tutoriales
            href: tutoriales.qmd
          - text: Diseños de estudio
            href: disenos/index.qmd
          - text: Caso clínico estadístico
            href: casos/index.qmd
          - text: Vademécum estadístico
            href: vademecum/index.qmd
          - text: Blog
            href: blog.qmd
      - text: Consultorio
        href: herramientas/index.qmd
      - text: Recursos
        href: recursos.qmd
      - text: Sobre mí
        href: about.qmd
    right:
      - icon: github
        menu:
         - text: Código fuente
           href: https://github.com/ganthonyr19/myblog
         - text: Reportar un error
           href: https://github.com/ganthonyr19/myblog/issues
      - icon: instagram
        href: https://www.instagram.com/bioestadistica.en.linea/
        aria-label: Instagram de Bioestadística en línea
      - icon: twitter
        href: https://x.com/ganthonyrc
        # text: My twitter account
  page-footer: 
    left: |
      Creado con ![](/images/ricon24.png) y [Quarto](https://quarto.org).  
      Código fuente [![](/images/github-icon.png)](https://github.com/ganthonyr19/myblog) · [Instagram @bioestadistica.en.linea](https://www.instagram.com/bioestadistica.en.linea/)
    background: light
    right: |
     &copy; 2023-2026 Anthony Romero Cerdán  
      License: [CC BY NC SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).
    border: false
  reader-mode: true
format:
  html:
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    html-math-method: katex
    header-includes: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    page-layout: full
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    code-fold: true            # código plegado en todas las entradas
    code-summary: "Ver código"
    include-after-body:
      - _includes/sigue.html
      - _includes/entradas.html  # tiempo de lectura y palabras clave enlazadas a temas.html
mainfont: "Source Sans 3"
link-external-newwindow: TRUE